{% load static %}
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpChain — खाता पेंडिंग</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0c10; --card: #111318; --border: #1e2230;
            --accent: #f5a623; --text: #f1f5f9; --muted: #64748b; 
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(245,166,35,.02) 1px,transparent 1px),
                              linear-gradient(90deg,rgba(245,166,35,.02) 1px,transparent 1px);
            background-size: 40px 40px; pointer-events: none;
        }
        .orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .1; pointer-events: none; }
        .orb-1 { width:500px; height:500px; background:var(--accent); top:-150px; left:-100px; }
        
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,.4);
            max-width: 500px; width: 100%; text-align: center; position: relative; z-index: 10;
        }
        .icon {
            font-size: 60px; margin-bottom: 20px;
            display: inline-block; animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 24px; font-weight: 700; margin-bottom: 15px; color: var(--text);
        }
        p {
            font-size: 14px; color: var(--muted); margin-bottom: 30px; line-height: 1.6;
        }
        .btn {
            display: inline-block; padding: 12px 24px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff; border-radius: 8px; text-decoration: none;
            font-weight: 600; font-size: 14px; transition: all .2s;
            box-shadow: 0 4px 15px rgba(59,130,246,.3);
        }
        .btn:hover {
            transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,.4);
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="card">
        <div class="icon">⏳</div>
        <h1>खाता अभी चालू नहीं है</h1>
        <p>आपका अकाउंट अभी <strong>पेंडिंग</strong> स्थिति में है। एडमिन द्वारा आपके अकाउंट को वेरीफाई और अप्रूव (Activate) करने के बाद ही आप लॉगिन कर पाएंगे। कृपया कुछ समय प्रतीक्षा करें।</p>
        <a href="{% url 'login' %}" class="btn">लॉगिन पेज पर वापस जाएं</a>
    </div>
</body>
</html>
