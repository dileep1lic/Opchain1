<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Trade Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #181b21;
            --accent-blue: #2962ff;
            --text-primary: #ffffff;
            --text-secondary: #909399;
            --border-color: #333;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 350px;
            border: 1px solid var(--border-color);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            margin: 0;
            font-size: 24px;
            color: var(--text-primary);
        }

        .login-header p {
            margin: 5px 0 0;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: rgba(255, 255, 255, 0.08);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #1c44b2;
        }

        .error-msg {
            color: #ff1744;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(255, 23, 68, 0.1);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 23, 68, 0.3);
        }

        /* ── Back to Dashboard Link CSS ── */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h2>⚙️ System Login</h2>
            <p>सुपरयूज़र क्रेडेंशियल्स दर्ज करें</p>
        </div>

        {% if form.errors %}
            <div class="error-msg">Username या Password गलत है। कृपया पुनः प्रयास करें।</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" placeholder="Admin">
            </div>
            
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password" placeholder="••••••••">
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="login-btn">Secure Login ↗</button>
        </form>

        <a href="{% url 'dashboard' %}" class="back-link">
            ← डैशबोर्ड पर वापस जाएँ
        </a>
    </div>

</body>
</html>
