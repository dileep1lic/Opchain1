<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📈 Option Candle Chart</title>

  <!-- TradingView Lightweight Charts — defer so page renders first -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>

  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --accent:  #58a6ff;
      --green:   #3fb950;
      --red:     #f85149;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --font:    'Courier New', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }
    .logo { font-size: 1.1rem; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
    .meta { font-size: 0.75rem; color: var(--muted); }
    .meta span { color: var(--text); margin-left: 6px; }

    /* ── Controls ── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .controls label { font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 3px; }
    .controls input, .controls select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.76rem;
      padding: 5px 8px;
      border-radius: 4px;
      outline: none;
    }
    .controls input:focus, .controls select:focus { border-color: var(--accent); }
    .controls button {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: var(--font);
      font-size: 0.76rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity .2s;
    }
    .controls button:hover { opacity: .85; }
    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font);
      font-size: 0.73rem;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .refresh-btn.active { border-color: var(--green); color: var(--green); background: #3fb95011; }
    .refresh-btn:hover  { border-color: var(--accent); color: var(--accent); }

    /* ── Stats bar ── */
    #stats {
      display: flex;
      gap: 20px;
      padding: 7px 24px;
      font-size: 0.76rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .stat-item { display: flex; flex-direction: column; }
    .stat-label { color: var(--muted); font-size: 0.65rem; margin-bottom: 2px; }
    .stat-val { font-size: 0.88rem; font-weight: bold; }
    .up   { color: var(--green); }
    .down { color: var(--red); }

    /* ── Countdown ── */
    #countdown-bar {
      height: 2px; background: var(--border);
      position: relative; display: none; flex-shrink: 0;
    }
    #countdown-bar.active { display: block; }
    #countdown-fill {
      height: 100%; background: var(--green);
      width: 100%; transition: width linear;
    }
    #refresh-status {
      font-size: 0.68rem; color: var(--muted);
      padding: 3px 24px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: none; flex-shrink: 0;
    }
    #refresh-status.active { display: block; }
    .pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Chart container ── */
    #chart-wrap {
      position: relative;
      width: 100%;
      flex-grow: 1;
      overflow: hidden;
    }
    #chart { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }

    /* ── Loading / Error ── */
    #loading {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(13,17,23,0.75); z-index: 10;
      font-size: 0.9rem; color: var(--muted);
    }
    #loading.show { display: flex; }
    #message {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      font-size: 0.88rem; color: var(--red); z-index: 10;
    }
    #message.show { display: flex; }

    /* ── Table ── */
    .table-wrap { padding: 0 24px 24px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
    thead th {
      text-align: left; padding: 7px 10px; color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-weight: normal; letter-spacing: 1px; font-size: 0.65rem;
    }
    tbody tr:hover { background: var(--surface); }
    tbody td { padding: 5px 10px; border-bottom: 1px solid #21262d; }
    .candle-up   { color: var(--green); }
    .candle-down { color: var(--red); }
  </style>
</head>
<body>

<header>
  <div class="logo">📈 Option Chart</div>
  <div class="meta">
    Symbol: <span id="hdr-symbol">{{ symbol }}</span> &nbsp;|&nbsp;
    Interval: <span id="hdr-interval">{{ interval }}m</span> &nbsp;|&nbsp;
    Range: <span>{{ from_date }} → {{ to_date }}</span>
  </div>
</header>

<div class="controls">
  <div>
    <label>Symbol</label>
    <input id="ctrl-symbol" type="text" value="{{ symbol }}" style="width:200px">
  </div>
  <div>
    <label>Unit</label>
    <select id="ctrl-unit" onchange="updateIntervalOptions()">
      <option value="minutes" {% if unit == "minutes" or not unit %}selected{% endif %}>Minutes</option>
      <option value="hours"   {% if unit == "hours" %}selected{% endif %}>Hours</option>
      <option value="days"    {% if unit == "days"  %}selected{% endif %}>Days</option>
    </select>
  </div>
  <div>
    <label>Interval</label>
    <select id="ctrl-interval">
      <option value="5" selected>5</option>
    </select>
  </div>
  <div>
    <label>From</label>
    <input id="ctrl-from" type="date" value="{{ from_date }}">
  </div>
  <div>
    <label>To</label>
    <input id="ctrl-to" type="date" value="{{ to_date }}">
  </div>
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <button onclick="loadChart()">🔄 Update</button>
    <select id="refresh-interval" style="background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:0.76rem;padding:5px 8px;border-radius:4px;">
      <option value="30">30 सेकंड</option>
      <option value="60" selected>1 मिनट</option>
      <option value="120">2 मिनट</option>
      <option value="300">5 मिनट</option>
    </select>
    <button class="refresh-btn" id="auto-refresh-btn" onclick="toggleAutoRefresh()">
      <span id="ar-icon">⏸</span>
      <span id="ar-label">Auto OFF</span>
    </button>
    <button class="refresh-btn active" id="reversal-toggle-btn" onclick="toggleReversalLines()">
      <span id="rv-icon">📉</span>
      <span id="rv-label">Reversal ON</span>
    </button>
    <button class="refresh-btn" id="table-toggle-btn" onclick="toggleTable()">
      <span id="table-icon">📋</span>
      <span id="table-label">Table दिखाएं</span>
    </button>
  </div>
</div>

<div id="countdown-bar"><div id="countdown-fill"></div></div>
<div id="refresh-status">🟢 <span class="pulse">●</span> Auto Refresh चालू — अगला: <span id="next-refresh">—</span></div>

<div id="stats">
  <div class="stat-item"><span class="stat-label">OPEN</span>  <span class="stat-val" id="s-open">—</span></div>
  <div class="stat-item"><span class="stat-label">HIGH</span>  <span class="stat-val up"   id="s-high">—</span></div>
  <div class="stat-item"><span class="stat-label">LOW</span>   <span class="stat-val down" id="s-low">—</span></div>
  <div class="stat-item"><span class="stat-label">CLOSE</span> <span class="stat-val" id="s-close">—</span></div>
  <div class="stat-item"><span class="stat-label">VOLUME</span><span class="stat-val" id="s-vol">—</span></div>
  <div class="stat-item"><span class="stat-label">CANDLES</span><span class="stat-val" id="s-count">—</span></div>
</div>

<div id="chart-wrap">
  <div id="loading">⏳ Data load हो रही है...</div>
  <div id="message"></div>
  <div id="chart"></div>
</div>

<div class="table-wrap" id="table-section" style="display:none;">
  <table>
    <thead>
      <tr><th>#</th><th>TIME</th><th>OPEN</th><th>HIGH</th><th>LOW</th><th>CLOSE</th><th>VOLUME</th><th>CHANGE</th></tr>
    </thead>
    <tbody id="candle-table"></tbody>
  </table>
</div>

<script>
  // ── Initial data from Django ─────────────────────────────────
  const initialCandles   = {{ candles|safe }};
  const initialError     = "{{ error|default:'' }}";
  const initialReversals = {{ reversal_lines|safe }};

  let lastReversals   = (initialReversals || []).filter(r => r && r.price > 0);
  let reversalVisible = true;
  let tableVisible    = false;

  // ✅ Fix 1: Chart एक बार बनाओ, variables बाहर रखो
  let mainChart      = null;
  let candleSeries   = null;
  let reversalSeries = [];  // current reversal line series

  const IST_OFFSET = 19800; // seconds (+5:30)

  // ── Chart INIT — सिर्फ एक बार चलता है ──────────────────────
  function initChart() {
    const container = document.getElementById('chart-wrap');
    mainChart = LightweightCharts.createChart(
      document.getElementById('chart'), {
        layout:     { background: { color: '#0d1117' }, textColor: '#8b949e' },
        grid:       { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
        crosshair:  { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#30363d' },
        timeScale:  { borderColor: '#30363d', timeVisible: true, secondsVisible: false },
        width:  container.clientWidth,
        height: container.clientHeight,
      }
    );

    candleSeries = mainChart.addCandlestickSeries({
      upColor:        '#3fb950', downColor:     '#f85149',
      borderUpColor:  '#3fb950', borderDownColor:'#f85149',
      wickUpColor:    '#3fb950', wickDownColor:  '#f85149',
    });

    // Crosshair hover → stats update
    mainChart.subscribeCrosshairMove(param => {
      if (!param || !param.seriesData) return;
      const d = param.seriesData.get(candleSeries);
      if (d) {
        document.getElementById('s-open').textContent  = d.open.toFixed(2);
        document.getElementById('s-high').textContent  = d.high.toFixed(2);
        document.getElementById('s-low').textContent   = d.low.toFixed(2);
        document.getElementById('s-close').textContent = d.close.toFixed(2);
      }
    });

    // Resize
    window.addEventListener('resize', () => {
      mainChart.applyOptions({
        width:  container.clientWidth,
        height: container.clientHeight,
      });
    });
  }

  // ── ✅ Fix 1: Data UPDATE — chart rebuild नहीं होता ──────────
  function updateChartData(candles, reversals) {
    if (!mainChart || !candleSeries) return;

    // Candle data convert
    const cdData = candles.map(c => ({
      time:  Math.floor(new Date(c.time).getTime() / 1000) + IST_OFFSET,
      open:  c.open,
      high:  c.high,
      low:   c.low,
      close: c.close,
    }));

    // ✅ setData() — chart destroy नहीं होता, सिर्फ data replace होता है
    candleSeries.setData(cdData);

    // Reversal lines update
    updateReversalLines(candles, reversals, cdData);

    // Zoom fit (सिर्फ पहली बार)
    if (!window._chartInitialized) {
      mainChart.timeScale().fitContent();
      window._chartInitialized = true;
    }

    // Stats update
    updateStats(candles);

    // Table update (अगर visible है तभी)
    if (tableVisible) buildTable(candles);
  }

  // ── Reversal lines ─────────────────────────────────────────
  function updateReversalLines(candles, reversals, cdData) {
    // पुरानी lines हटाओ
    reversalSeries.forEach(s => { try { mainChart.removeSeries(s); } catch(e){} });
    reversalSeries = [];

    if (!reversalVisible || !reversals || reversals.length === 0) return;

    // Line time range: आखिरी candle की date पर 9:15 → 15:30
    const lastDate = new Date(candles[candles.length - 1].time);
    const startD   = new Date(lastDate); startD.setHours(9, 15, 0, 0);
    const endD     = new Date(lastDate); endD.setHours(15, 30, 0, 0);
    const t1 = Math.floor(startD.getTime() / 1000) + IST_OFFSET;
    const t2 = Math.floor(endD.getTime()   / 1000) + IST_OFFSET;

    reversals.filter(r => r && r.price > 0).forEach(rev => {
      try {
        const ls = mainChart.addLineSeries({
          color:            rev.color,
          lineWidth:        rev.width || 1,
          lineStyle:        rev.dash  || 0,
          priceLineVisible: false,
          lastValueVisible: true,
          title:            rev.label || '',
        });
        ls.setData([
          { time: t1, value: Number(rev.price) },
          { time: t2, value: Number(rev.price) },
        ]);
        reversalSeries.push(ls);
      } catch(e) { console.warn('Reversal line error:', e.message); }
    });
  }

  // ── ✅ Fix 3: Stats — spread operator हटाया, for loop use किया ──
  function updateStats(candles) {
    if (!candles.length) return;
    let high = -Infinity, low = Infinity, vol = 0;
    for (let i = 0; i < candles.length; i++) {
      if (candles[i].high > high) high = candles[i].high;
      if (candles[i].low  < low)  low  = candles[i].low;
      vol += candles[i].volume;
    }
    document.getElementById('s-open').textContent  = candles[0].open.toFixed(2);
    document.getElementById('s-high').textContent  = high.toFixed(2);
    document.getElementById('s-low').textContent   = low.toFixed(2);
    document.getElementById('s-close').textContent = candles[candles.length - 1].close.toFixed(2);
    document.getElementById('s-vol').textContent   = vol.toLocaleString('en-IN');
    document.getElementById('s-count').textContent = candles.length;
  }

  // ── ✅ Fix 2: Table — innerHTML += हटाया, DocumentFragment use किया ──
  function buildTable(candles) {
    const tbody = document.getElementById('candle-table');
    const frag  = document.createDocumentFragment();

    candles.slice().reverse().forEach((c, i) => {
      const change = c.close - c.open;
      const pct    = ((change / c.open) * 100).toFixed(2);
      const cls    = change >= 0 ? 'candle-up' : 'candle-down';
      const sign   = change >= 0 ? '▲' : '▼';
      const dt     = new Date(c.time).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });

      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td class="${cls}">${i + 1}</td>` +
        `<td>${dt}</td>` +
        `<td>${c.open.toFixed(2)}</td>` +
        `<td class="candle-up">${c.high.toFixed(2)}</td>` +
        `<td class="candle-down">${c.low.toFixed(2)}</td>` +
        `<td class="${cls}">${c.close.toFixed(2)}</td>` +
        `<td>${c.volume.toLocaleString('en-IN')}</td>` +
        `<td class="${cls}">${sign} ${Math.abs(change).toFixed(2)} (${pct}%)</td>`;
      frag.appendChild(tr);
    });

    tbody.replaceChildren(frag); // ✅ एक ही DOM operation — no repaint loop
  }

  // ── AJAX load ──────────────────────────────────────────────
  function loadChart() {
    const symbol   = document.getElementById('ctrl-symbol').value.trim();
    const unit     = document.getElementById('ctrl-unit').value;
    const interval = document.getElementById('ctrl-interval').value;
    const fromDate = document.getElementById('ctrl-from').value;
    const toDate   = document.getElementById('ctrl-to').value;

    showLoading(true);
    hideMsg();

    
    // ✅ अब — reversalVisible false हो तो &reversal=0 भेजो
    const url = `/api/candle/?symbol=${encodeURIComponent(symbol)}&unit=${unit}&interval=${interval}&from_date=${fromDate}&to_date=${toDate}&reversal=${reversalVisible ? 1 : 0}`;
    fetch(url)
      .then(r => r.json())
      .then(data => {
        showLoading(false);
        if (data.error) { showMsg('❌ Error: ' + data.error); return; }
        document.getElementById('hdr-symbol').textContent   = symbol;
        document.getElementById('hdr-interval').textContent = interval + (unit === 'minutes' ? 'm' : unit === 'hours' ? 'h' : 'd');
        if (data.reversal_lines && data.reversal_lines.length > 0) {
          lastReversals = data.reversal_lines.filter(r => r && r.price > 0);
        }
        window._chartInitialized = false; // नया symbol → fitContent करो
        updateChartData(data.candles, lastReversals);
      })
      .catch(err => {
        showLoading(false);
        showMsg('❌ Network Error: ' + err.message);
      });
  }

  // Silent refresh — UI block नहीं होता ─────────────────────
  function silentRefresh() {
    if (!isAutoRefresh) return;
    const symbol   = document.getElementById('ctrl-symbol').value.trim();
    const unit     = document.getElementById('ctrl-unit').value;
    const interval = document.getElementById('ctrl-interval').value;
    const fromDate = document.getElementById('ctrl-from').value;
    const toDate   = document.getElementById('ctrl-to').value;

    const url = `/api/candle/?symbol=${encodeURIComponent(symbol)}&unit=${unit}&interval=${interval}&from_date=${fromDate}&to_date=${toDate}`;

    fetch(url)
      .then(r => r.json())
      .then(data => {
        if (!data.error && data.candles && data.candles.length > 0) {
          if (data.reversal_lines && data.reversal_lines.length > 0)
            lastReversals = data.reversal_lines.filter(r => r && r.price > 0);
          updateChartData(data.candles, lastReversals);
        }
        scheduleNext();
      })
      .catch(() => scheduleNext());
  }

  // ── Auto Refresh ──────────────────────────────────────────
  let autoRefreshTimer = null;
  let countdownTimer   = null;
  let isAutoRefresh    = false;
  let remainingSeconds = 0;

  function toggleAutoRefresh() { isAutoRefresh ? stopAutoRefresh() : startAutoRefresh(); }

  function startAutoRefresh() {
    isAutoRefresh = true;
    document.getElementById('auto-refresh-btn').classList.add('active');
    document.getElementById('ar-icon').textContent  = '▶';
    document.getElementById('ar-label').textContent = 'Auto ON';
    document.getElementById('countdown-bar').classList.add('active');
    document.getElementById('refresh-status').classList.add('active');
    scheduleNext();
  }

  function stopAutoRefresh() {
    isAutoRefresh = false;
    clearTimeout(autoRefreshTimer);
    clearInterval(countdownTimer);
    document.getElementById('auto-refresh-btn').classList.remove('active');
    document.getElementById('ar-icon').textContent  = '⏸';
    document.getElementById('ar-label').textContent = 'Auto OFF';
    document.getElementById('countdown-bar').classList.remove('active');
    document.getElementById('refresh-status').classList.remove('active');
    document.getElementById('countdown-fill').style.width = '100%';
  }

  function scheduleNext() {
    if (!isAutoRefresh) return;
    const seconds    = parseInt(document.getElementById('refresh-interval').value);
    remainingSeconds = seconds;

    const fill = document.getElementById('countdown-fill');
    fill.style.transition = 'none';
    fill.style.width = '100%';
    setTimeout(() => {
      fill.style.transition = `width ${seconds}s linear`;
      fill.style.width = '0%';
    }, 50);

    clearInterval(countdownTimer);
    updateCountdownText();
    countdownTimer = setInterval(() => {
      remainingSeconds--;
      updateCountdownText();
      if (remainingSeconds <= 0) clearInterval(countdownTimer);
    }, 1000);

    clearTimeout(autoRefreshTimer);
    autoRefreshTimer = setTimeout(silentRefresh, seconds * 1000);
  }

  function updateCountdownText() {
    const s = remainingSeconds;
    document.getElementById('next-refresh').textContent =
      (s >= 60 ? `${Math.floor(s/60)}m ${s%60}s` : `${s}s`) + ' में';
  }

  // ── Reversal toggle ───────────────────────────────────────
  function toggleReversalLines() {
    reversalVisible = !reversalVisible;
    const btn = document.getElementById('reversal-toggle-btn');
    btn.classList.toggle('active', reversalVisible);
    document.getElementById('rv-label').textContent = reversalVisible ? 'Reversal ON' : 'Reversal OFF';
    // ✅ सिर्फ reversal lines update करो, पूरा chart नहीं
    updateReversalLines(window._lastCandles || [], reversalVisible ? lastReversals : [], []);
  }

  // ── Table toggle ──────────────────────────────────────────
  function toggleTable() {
    tableVisible = !tableVisible;
    const section = document.getElementById('table-section');
    section.style.display = tableVisible ? 'block' : 'none';
    document.getElementById('table-toggle-btn').classList.toggle('active', tableVisible);
    document.getElementById('table-icon').textContent  = tableVisible ? '✖' : '📋';
    document.getElementById('table-label').textContent = tableVisible ? 'Table छुपाएं' : 'Table दिखाएं';
    // ✅ Table सिर्फ तब build करो जब user खोले
    if (tableVisible && window._lastCandles) buildTable(window._lastCandles);
  }

  // ── Interval options ──────────────────────────────────────
  const intervalOptions = {
    minutes: [1,2,3,5,10,15,20,25,30,60,120,180,240,300],
    hours:   [1,2,3,4,5],
    days:    [1],
  };
  function updateIntervalOptions() {
    const unit   = document.getElementById('ctrl-unit').value;
    const select = document.getElementById('ctrl-interval');
    const prev   = select.value;
    select.innerHTML = '';
    intervalOptions[unit].forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      if (String(v) === prev) opt.selected = true;
      select.appendChild(opt);
    });
    if (!select.value) select.selectedIndex = 0;
  }

  // ── Helpers ───────────────────────────────────────────────
  function showLoading(show) {
    document.getElementById('loading').classList.toggle('show', show);
  }
  function showMsg(msg) {
    const el = document.getElementById('message');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideMsg() {
    document.getElementById('message').classList.remove('show');
  }

  // ── Page init ────────────────────────────────────────────
  function onLibReady() {
    initChart();
    updateIntervalOptions();

    if (initialCandles && initialCandles.length > 0) {
      // Server ne data bheja (purana flow) — seedha render karo
      window._lastCandles = initialCandles;
      updateChartData(initialCandles, lastReversals);
    } else {
      // ✅ Fix: Server ne [] bheja — AJAX se load karo, error mat dikhao
      loadChart();
    }
  }

  // LightweightCharts defer hai — load hone tak wait karo
  function waitForLib(cb) {
    if (typeof LightweightCharts !== 'undefined') {
      cb();
    } else {
      // Script tag ka load event
      const s = document.querySelector('script[src*="lightweight-charts"]');
      if (s) {
        s.addEventListener('load', cb, { once: true });
      } else {
        // Last resort fallback
        window.addEventListener('load', cb, { once: true });
      }
    }
  }

  waitForLib(onLibReady);
</script>
</body>
</html>
