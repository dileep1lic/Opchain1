<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reversal Price Chart</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        .input-group { margin-bottom: 10px; }
        input { margin-right: 10px; padding: 5px; width: 100px; }
    </style>
</head>
<body>

    <h2>Reversal Price Candlestick Chart</h2>
    
    <div style="display: flex; gap: 20px;">
        <div class="input-group">
            <h3>CE Strike Prices</h3>
            <input type="number" id="ce_1" placeholder="CE Strike 1">
            <input type="number" id="ce_2" placeholder="CE Strike 2">
            <input type="number" id="ce_3" placeholder="CE Strike 3">
        </div>
        <div class="input-group">
            <h3>PE Strike Prices</h3>
            <input type="number" id="pe_1" placeholder="PE Strike 1">
            <input type="number" id="pe_2" placeholder="PE Strike 2">
            <input type="number" id="pe_3" placeholder="PE Strike 3">
        </div>
        <div class="input-group">
            <h3>Timeframe</h3>
            <select id="timeframe" style="padding: 5px;">
                <option value="1">1 Minute</option>
                <option value="3">3 Minutes</option>
                <option value="5" selected>5 Minutes</option>
                <option value="15">15 Minutes</option>
                <option value="30">30 Minutes</option>
                <option value="60">1 Hour</option>
            </select>
        </div>
    </div>
    
    <button onclick="startLiveChart()" style="padding: 10px 20px; cursor: pointer; background-color: #4CAF50; color: white; border: none;">Generate Live Chart</button>
    

    <div id="chartDiv" style="width:100%; height:600px; margin-top: 20px;"></div>
    

    <script>
        function generateChart() {
            
            // CSRF Token aur Data setup karein
            let formData = new FormData();
            let selectedTimeframe = document.getElementById('timeframe').value;
            formData.append('timeframe', selectedTimeframe);
            formData.append('ce_1', document.getElementById('ce_1').value);
            formData.append('ce_2', document.getElementById('ce_2').value);
            formData.append('ce_3', document.getElementById('ce_3').value);
            formData.append('pe_1', document.getElementById('pe_1').value);
            formData.append('pe_2', document.getElementById('pe_2').value);
            formData.append('pe_3', document.getElementById('pe_3').value);
            
            // Assume CSRF token is handled if using Django standard form, here skipping for simplicity
            fetch('', { 
                method: 'POST',
                body: formData,
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            })
            // ✅ सिर्फ एक बार response को JSON में बदलें
            .then(response => response.json())
            // ✅ और सिर्फ एक बार डेटा को drawChart में भेजें
            .then(data => {
                // यहाँ start_time और end_time भी पास करें
                drawChart(data.candles, data.lines, data.start_time, data.end_time); 
            });
        }

        // फंक्शन में start_time और end_time रिसीव करें
        function drawChart(candles, lines, start_time, end_time) { 
            let x_times = candles.map(c => c.time);
            
            let trace_candlestick = {
                x: x_times,
                close: candles.map(c => c.close),
                high: candles.map(c => c.high),
                low: candles.map(c => c.low),
                open: candles.map(c => c.open),
                type: 'candlestick',
                name: 'Spot Price',
                increasing: { line: { color: '#0b7504', width: 2 }, fillcolor: '#0b7504' },
                decreasing: { line: { color: '#EF5350', width: 2 }, fillcolor: '#EF5350' }
            };

            let layout = {
                title: 'Spot Price with Reversal Levels',
                xaxis: {
                    title: 'Time',
                    type: 'date',
                    tickformat: '%H:%M',
                    rangeslider: { visible: false },
                    tickangle: -45,
                    // X-Axis को 9:15 से 15:30 तक फिक्स कर दिया
                    range: [start_time, end_time], 
                },
                yaxis: { 
                    title: 'Price',
                    autorange: true 
                },
                shapes: [],
                annotations: []
            };

            // ✅ यह लूप मिसिंग था! यह लाइन्स और उनके नाम ऐड करेगा
            lines.forEach(line => {
                // लाइन ड्रा करना
                layout.shapes.push({
                    type: 'line',
                    xref: 'paper', x0: 0, x1: 1, 
                    yref: 'y', y0: line.price, y1: line.price,
                    line: { color: line.color, width: 2, dash: 'dashdot' }
                });

                // लाइन पर नाम (Annotation) लिखना
                layout.annotations.push({
                    xref: 'paper', x: 0.99, 
                    yref: 'y', y: line.price,
                    text: `<b>${line.name} (${line.price})</b>`, 
                    showarrow: false,
                    font: { color: line.color, size: 13 },
                    xanchor: 'right', 
                    yanchor: 'bottom' 
                });
            });

            Plotly.newPlot('chartDiv', [trace_candlestick], layout);
        }
        // ऑटो-अपडेट के लिए वेरिएबल
        let autoUpdateInterval;

        // जब यूज़र "Generate Chart" बटन दबाएगा, तो यह फंक्शन चलेगा
        function startLiveChart() {
            // 1. पहली बार चार्ट तुरंत जनरेट करें
            generateChart();

            // 2. अगर पहले से कोई टाइमर चल रहा है, तो उसे बंद करें
            if (autoUpdateInterval) {
                clearInterval(autoUpdateInterval);
            }

            // 3. हर 1 मिनट (60000 milliseconds) में चार्ट को अपने आप अपडेट करें
            autoUpdateInterval = setInterval(() => {
                console.log("Auto-updating chart..."); // यह बस चेक करने के लिए है कि अपडेट हो रहा है
                generateChart();
            }, 60000); // 60000 ms = 1 मिनट। आप इसे 300000 (5 मिनट) भी कर सकते हैं।
        }
    </script>
</body>
</html>
