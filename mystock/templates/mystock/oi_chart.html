<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ symbol }} {{ strike }}</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #0f1115; /* Main Dark Background */
            color: white;
            font-family: 'Segoe UI', sans-serif; /* Better Font */
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* Top Bar Styling */
        .top-bar {
            height: 40px; 
            background-color: #181b21; /* Slightly lighter than body */
            display: flex; align-items: center; justify-content: center;
            gap: 15px; border-bottom: 1px solid #333; flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .info-tag {
            font-size: 13px; color: #ffc107; font-weight: 700;
            margin-right: 10px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .tab-button {
            background-color: transparent; 
            border: 1px solid #444; color: #aaa;
            padding: 5px 15px; font-size: 11px; font-weight: 600; cursor: pointer;
            border-radius: 4px; transition: all 0.3s ease;
        }

        .tab-button:hover { background-color: #333; color: white; border-color: #666; }
        
        .tab-button.active { 
            background-color: #2962ff; color: white; border-color: #2962ff; 
            box-shadow: 0 0 10px rgba(41, 98, 255, 0.4);
        }
        
        /* Chart Area */
        .chart-container {
            flex-grow: 1; display: none; 
            align-items: center; justify-content: center;
            background-color: #0f1115; /* Ensure background match */
            padding: 10px;
        }
        .chart-container.active { display: flex; }
        
        img { 
            max-width: 100%; max-height: 95%; 
            object-fit: contain; 
            /* Remove border from image since chart has its own styling now */
            border: none; 
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="info-tag">{{ symbol }} {{ strike }}</span>
        <button class="tab-button active" onclick="openTab(event, 'TotalOI')">TOTAL OI</button>
        <button class="tab-button" onclick="openTab(event, 'PercentOI')">CHANGE %</button>
    </div>

    <div id="TotalOI" class="chart-container active">
        <img src="data:image/png;base64,{{ chart_oi }}" alt="Total OI Chart">
    </div>

    <div id="PercentOI" class="chart-container">
        <img src="data:image/png;base64,{{ chart_pct }}" alt="OI % Chart">
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, containers, buttons;
            containers = document.getElementsByClassName("chart-container");
            for (i = 0; i < containers.length; i++) containers[i].classList.remove("active");
            buttons = document.getElementsByClassName("tab-button");
            for (i = 0; i < buttons.length; i++) buttons[i].classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
