<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Option Reversal Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Roboto', 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1500px;
    margin: auto;
}

.top-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    align-items: center;
}

select {
    background: #1e293b;
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 5px;
    height: 150px;
    width: 160px;
    font-family: 'Roboto', sans-serif;
}

button {
    background: linear-gradient(90deg,#00c6ff,#0072ff);
    border: none;
    padding: 10px 25px;
    border-radius: 8px;
    font-weight: 500;
    font-family: 'Roboto', sans-serif;
    color: white;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

#chart {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
}

input {
    background: #1e293b;
    color: white;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 6px;
    width: 100px;
    margin: 5px;
    font-family: 'Roboto', sans-serif;
}
</style>
</head>

<body>

<div class="container">

    <div class="top-bar">

    <div>
        <b>CE Strikes</b><br>
        <input type="number" id="ce1" placeholder="CE 1">
        <input type="number" id="ce2" placeholder="CE 2">
        <input type="number" id="ce3" placeholder="CE 3">
    </div>

    <div>
        <b>PE Strikes</b><br>
        <input type="number" id="pe1" placeholder="PE 1">
        <input type="number" id="pe2" placeholder="PE 2">
        <input type="number" id="pe3" placeholder="PE 3">
    </div>

    <button onclick="updateChart()">Update</button>

</div>

    <div id="chart"></div>

</div>

<script>

let chart;

function getInputValues(prefix) {
    let values = [];
    for (let i = 1; i <= 3; i++) {
        let val = document.getElementById(prefix + i).value;
        if (val) values.push(val);
    }
    return values;
}

function buildQueryParams(ce, pe) {
    const query = new URLSearchParams();
    ce.forEach(v => query.append("ce_strikes[]", v));
    pe.forEach(v => query.append("pe_strikes[]", v));
    return query.toString();
}

function fetchChartData() {

    const ce_strikes = getInputValues("ce");
    const pe_strikes = getInputValues("pe");

    const queryString = buildQueryParams(ce_strikes, pe_strikes);

    fetch(`/option-chart-api/?${queryString}`)
        .then(res => res.json())
        .then(data => {

            let seriesData = [];

            seriesData.push({
                name: "Spot Price",
                type: "line",
                data: data.spot_prices
            });

            Object.keys(data.ce_reversals).forEach(strike => {
                seriesData.push({
                    name: strike + " CE",
                    type: "line",
                    data: data.ce_reversals[strike],
                    dashArray: 2
                });
            });

            Object.keys(data.pe_reversals).forEach(strike => {
                seriesData.push({
                    name: strike + " PE",
                    type: "line",
                    data: data.pe_reversals[strike],
                    dashArray: 4
                });
            });

            if (!chart) {
                chart = new ApexCharts(document.querySelector("#chart"), {
                    chart: {
                        height: 600,
                        type: "line",
                        animations: { enabled: false },
                        fontFamily: "Roboto, 'Segoe UI', sans-serif"
                    },
                    stroke: { curve: "straight", width: 3 },
                    xaxis: { 
                        categories: data.timestamps,
                        labels: { style: { fontFamily: "Roboto, 'Segoe UI', sans-serif", colors: "#e2e8f0" } }
                    },
                    tooltip: { shared: true, intersect: false },
                    legend: { 
                        position: "bottom",
                        labels: { colors: "#e2e8f0", fontFamily: "Roboto, 'Segoe UI', sans-serif" }
                    },
                    series: seriesData
                });
                chart.render();
            } else {
                chart.updateOptions({
                    xaxis: { categories: data.timestamps }
                });
                chart.updateSeries(seriesData);
            }
        });
}

function updateChart() {
    fetchChartData();
}

fetchChartData();
setInterval(fetchChartData, 5000);

</script>

</body>
</html>
