services:
  # ── Web Service (Django + Daphne) ──────────────────────────────────
  - type: web
    name: optchain
    runtime: python
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT --access-log - --proxy-headers myproject.asgi:application
    
    # ✅ Health Check — Render इस URL को ping करके server alive रखेगा
    healthCheckPath: /health/
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false   # Render Dashboard से manually set करें
      - key: DATABASE_URL
        fromDatabase:
          name: optchain-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: optchain-redis
          type: redis
          property: connectionString

  # ── Background Worker ───────────────────────────────────────────────
  - type: worker
    name: optchain-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_sync_async
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: optchain-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: optchain-redis
          type: redis
          property: connectionString

  # ── Keep-Alive Cron Job ─────────────────────────────────────────────
  # यह हर 10 मिनट में server को ping करता है ताकि वो sleep न हो
  - type: cron
    name: keep-alive-ping
    runtime: python
    schedule: "*/10 * * * *"   # हर 10 मिनट
    buildCommand: "echo 'keep alive'"
    startCommand: "curl -s https://optchain.onrender.com/health/ || echo 'ping failed'"
